title: "Hub-and-spoke network"
subtitle: "Central egress via Azure Firewall Premium"

containers:
  - name: "rg-net-hub"
    kind: resource-group
    containers:
      - name: "vnet-hub · 10.0.0.0/22"
        kind: vnet
        resources:
          - id: afw
            type: firewall
            label: "afw-hub"
            meta: ["Premium", "egress"]
          - id: bastion
            type: bastion
            label: "bas-hub"
            meta: ["Standard"]

  - name: "rg-app-prod"
    kind: resource-group
    containers:
      - name: "vnet-app-prod"
        kind: vnet
        resources:
          - id: aks
            type: kubernetes-services
            label: "aks-prod"
            meta: ["System + User pools"]

  - name: "rg-data"
    kind: resource-group
    containers:
      - name: "vnet-data"
        kind: vnet
        resources:
          - id: cosmos
            type: cosmos-db
            label: "cosmos-data"
            meta: ["Provisioned"]
          - id: func
            type: function-app
            label: "func-data"
            meta: ["Consumption"]

edges:
  - from: aks
    to: afw
    label: "peered · egress"
  - from: cosmos
    to: afw
    label: "peered · egress"
  - from: func
    to: afw
    label: "peered · egress"

metadata:
  Owner: "platform-eng"
  Topology: "hub-and-spoke"
  Hub CIDR: "10.0.0.0/22"
  Egress: "Azure Firewall Premium"
