title: "Event-driven blob ingestion pipeline"
subtitle: "Storage -> Event Grid -> Functions -> Cosmos DB + Service Bus (PaaS, no vnet)"

containers:
  - name: "rg-pipeline-prod"
    kind: resource-group
    resources:
      - id: blob
        type: storage-accounts
        label: "ingest storage"
        meta: ["blob events"]
      - id: eg
        type: event-grid-topics
        label: "event grid"
        meta: ["system topic"]
      - id: fn
        type: function-apps
        label: "processor"
        meta: ["Consumption"]
      - id: cosmos
        type: azure-cosmos-db
        label: "results store"
        meta: ["Serverless"]
      - id: sb
        type: azure-service-bus
        label: "downstream bus"
        meta: ["Standard"]
      - id: law
        type: log-analytics-workspaces
        label: "central logs"

edges:
  - from: blob
    to: eg
    label: "blob created"
  - from: eg
    to: fn
    label: "event subscription"
  - from: fn
    to: cosmos
    label: "write results"
  - from: fn
    to: sb
    label: "emit message"
  - from: blob
    to: law
    label: "diagnostics"
    style: dashed
  - from: eg
    to: law
    label: "diagnostics"
    style: dashed
  - from: fn
    to: law
    label: "diagnostics"
    style: dashed
  - from: cosmos
    to: law
    label: "diagnostics"
    style: dashed
  - from: sb
    to: law
    label: "diagnostics"
    style: dashed

options:
  row_wrap: 5
  cell_width: 150

metadata:
  Resource group: "rg-pipeline-prod"
  Network: "PaaS only (no vnet)"
  Compute: "Functions Consumption"
  Data: "Cosmos DB Serverless"
