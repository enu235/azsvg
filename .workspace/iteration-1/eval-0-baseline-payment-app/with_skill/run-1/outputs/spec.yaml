title: "Contoso Payment Service — Azure target architecture"
subtitle: "App Service + Azure SQL, private endpoints, single region (multi-region planned)"

containers:
  - name: "rg-payment-prod"
    kind: resource-group
    meta: ["West US 2"]
    resources:
      - id: kv
        type: key-vaults
        label: "kv-payment-prod"
        meta: ["connection strings"]
      - id: ai
        type: application-insights
        label: "appi-payment-prod"
        meta: ["telemetry"]
    containers:
      - name: "vnet-payment · 10.20.0.0/16"
        kind: vnet
        containers:
          - name: "snet-app · 10.20.1.0/24"
            kind: subnet
            resources:
              - id: app
                type: app-services
                label: "app-payment-prod"
                meta: ["P2v3", "West US 2"]
              - id: peApp
                type: private-endpoints
                label: "pe-app"
                meta: ["to SQL"]
          - name: "snet-data · 10.20.2.0/24"
            kind: subnet
            resources:
              - id: sql
                type: sql-database
                label: "sqldb-payment-prod"
                meta: ["General Purpose"]
              - id: peKv
                type: private-endpoints
                label: "pe-kv"
                meta: ["to Key Vault"]

edges:
  - from: app
    to: peApp
    label: "private endpoint"
  - from: peApp
    to: sql
    label: "TDS 1433"
  - from: app
    to: peKv
    label: "private endpoint"
  - from: peKv
    to: kv
    label: "secret read"
  - from: app
    to: ai
    label: "telemetry"

metadata:
  Owner: "payments-platform"
  Environment: "production"
  Region: "westus2 (multi-region planned)"
  Reviewed: "2026-05-30"
