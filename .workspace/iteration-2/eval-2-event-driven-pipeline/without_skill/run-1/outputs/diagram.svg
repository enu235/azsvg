<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowLog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafcff"/>
      <stop offset="100%" stop-color="#eef3fa"/>
    </linearGradient>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-size: 12px; fill: #6b7280; }
      .rg { fill: none; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .rg-label { font-size: 13px; fill: #2563eb; font-weight: 600; }
      .svc-label { font-size: 13px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .svc-sub { font-size: 11px; fill: #4b5563; text-anchor: middle; }
      .edge-label { font-size: 11px; fill: #374151; }
      .flow { stroke: #444; stroke-width: 2; fill: none; }
      .logflow { stroke: #888; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
      .legend { font-size: 11px; fill: #374151; }
    </style>

    <!-- Storage Account icon -->
    <symbol id="iconStorage" viewBox="0 0 64 64">
      <rect x="6" y="14" width="52" height="36" rx="4" fill="#0078D4"/>
      <rect x="10" y="20" width="44" height="6" fill="#fff" opacity="0.95"/>
      <rect x="10" y="30" width="44" height="6" fill="#fff" opacity="0.75"/>
      <rect x="10" y="40" width="44" height="6" fill="#fff" opacity="0.55"/>
      <circle cx="48" cy="23" r="1.6" fill="#0078D4"/>
      <circle cx="48" cy="33" r="1.6" fill="#0078D4"/>
      <circle cx="48" cy="43" r="1.6" fill="#0078D4"/>
    </symbol>

    <!-- Event Grid icon -->
    <symbol id="iconEventGrid" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="6" fill="#0072C6"/>
      <g stroke="#fff" stroke-width="2" fill="none">
        <line x1="16" y1="16" x2="32" y2="32"/>
        <line x1="48" y1="16" x2="32" y2="32"/>
        <line x1="16" y1="48" x2="32" y2="32"/>
        <line x1="48" y1="48" x2="32" y2="32"/>
      </g>
      <g fill="#fff">
        <circle cx="16" cy="16" r="4"/>
        <circle cx="48" cy="16" r="4"/>
        <circle cx="32" cy="32" r="5"/>
        <circle cx="16" cy="48" r="4"/>
        <circle cx="48" cy="48" r="4"/>
      </g>
    </symbol>

    <!-- Function App icon -->
    <symbol id="iconFunction" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="6" fill="#FFB900"/>
      <path d="M22 12 L40 12 L28 30 L42 30 L20 54 L30 36 L18 36 Z" fill="#fff"/>
    </symbol>

    <!-- Cosmos DB icon -->
    <symbol id="iconCosmos" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="26" fill="#3999C6"/>
      <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#fff" stroke-width="2"/>
      <ellipse cx="32" cy="32" rx="10" ry="26" fill="none" stroke="#fff" stroke-width="2"/>
      <ellipse cx="32" cy="32" rx="20" ry="20" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
      <circle cx="32" cy="6" r="2" fill="#fff"/>
      <circle cx="32" cy="58" r="2" fill="#fff"/>
      <circle cx="6" cy="32" r="2" fill="#fff"/>
      <circle cx="58" cy="32" r="2" fill="#fff"/>
    </symbol>

    <!-- Service Bus icon -->
    <symbol id="iconServiceBus" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="6" fill="#0078D4"/>
      <g fill="#fff">
        <rect x="10" y="18" width="20" height="10" rx="2"/>
        <rect x="10" y="36" width="20" height="10" rx="2"/>
        <rect x="34" y="27" width="20" height="10" rx="2"/>
      </g>
      <g stroke="#fff" stroke-width="2" fill="none">
        <path d="M30 23 L34 32"/>
        <path d="M30 41 L34 32"/>
      </g>
    </symbol>

    <!-- Log Analytics icon -->
    <symbol id="iconLogAnalytics" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="6" fill="#773ADC"/>
      <g fill="#fff">
        <rect x="12" y="38" width="6" height="14"/>
        <rect x="22" y="30" width="6" height="22"/>
        <rect x="32" y="22" width="6" height="30"/>
        <rect x="42" y="14" width="6" height="38"/>
      </g>
      <circle cx="48" cy="16" r="5" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="52" y1="20" x2="56" y2="24" stroke="#fff" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="40" y="44" class="title">Event-Driven Blob Ingestion Pipeline</text>
  <text x="40" y="62" class="subtitle">PaaS-only - no VNet - Azure (Production)</text>

  <!-- Resource Group boundary -->
  <rect x="40" y="90" width="1120" height="510" rx="14" class="rg"/>
  <text x="60" y="112" class="rg-label">Resource Group: rg-pipeline-prod</text>

  <!-- 1. Storage Account -->
  <g transform="translate(90,180)">
    <use href="#iconStorage" width="72" height="72"/>
    <text x="36" y="92" class="svc-label">Storage Account</text>
    <text x="36" y="108" class="svc-sub">Blob container</text>
    <text x="36" y="122" class="svc-sub">(source)</text>
  </g>

  <!-- 2. Event Grid -->
  <g transform="translate(290,180)">
    <use href="#iconEventGrid" width="72" height="72"/>
    <text x="36" y="92" class="svc-label">Event Grid</text>
    <text x="36" y="108" class="svc-sub">System topic</text>
    <text x="36" y="122" class="svc-sub">BlobCreated</text>
  </g>

  <!-- 3. Function App -->
  <g transform="translate(500,180)">
    <use href="#iconFunction" width="72" height="72"/>
    <text x="36" y="92" class="svc-label">Function App</text>
    <text x="36" y="108" class="svc-sub">Consumption tier</text>
    <text x="36" y="122" class="svc-sub">Event Grid trigger</text>
  </g>

  <!-- 4a. Cosmos DB (top-right) -->
  <g transform="translate(770,110)">
    <use href="#iconCosmos" width="72" height="72"/>
    <text x="36" y="92" class="svc-label">Cosmos DB</text>
    <text x="36" y="108" class="svc-sub">Serverless</text>
    <text x="36" y="122" class="svc-sub">(results store)</text>
  </g>

  <!-- 4b. Service Bus (bottom-right) -->
  <g transform="translate(770,290)">
    <use href="#iconServiceBus" width="72" height="72"/>
    <text x="36" y="92" class="svc-label">Service Bus</text>
    <text x="36" y="108" class="svc-sub">Queue / topic</text>
    <text x="36" y="122" class="svc-sub">(downstream msgs)</text>
  </g>

  <!-- 5. Log Analytics workspace -->
  <g transform="translate(530,460)">
    <use href="#iconLogAnalytics" width="72" height="72"/>
    <text x="36" y="92" class="svc-label">Log Analytics Workspace</text>
    <text x="36" y="108" class="svc-sub">Diagnostic settings from all services</text>
  </g>

  <!-- Flow arrows -->
  <!-- Storage -> Event Grid -->
  <path class="flow" d="M170,216 L290,216" marker-end="url(#arrow)"/>
  <text x="185" y="208" class="edge-label">Blob events</text>

  <!-- Event Grid -> Function App -->
  <path class="flow" d="M370,216 L500,216" marker-end="url(#arrow)"/>
  <text x="385" y="208" class="edge-label">Event subscription</text>

  <!-- Function App -> Cosmos DB -->
  <path class="flow" d="M580,200 C660,200 690,150 770,146" marker-end="url(#arrow)"/>
  <text x="615" y="172" class="edge-label">Write results</text>

  <!-- Function App -> Service Bus -->
  <path class="flow" d="M580,235 C660,235 690,320 770,326" marker-end="url(#arrow)"/>
  <text x="615" y="295" class="edge-label">Emit messages</text>

  <!-- Logs (dashed) from each service to Log Analytics -->
  <path class="logflow" d="M126,260 C126,360 360,420 565,465" marker-end="url(#arrowLog)"/>
  <path class="logflow" d="M326,260 C326,360 460,420 570,465" marker-end="url(#arrowLog)"/>
  <path class="logflow" d="M536,260 L575,465" marker-end="url(#arrowLog)"/>
  <path class="logflow" d="M806,190 C806,360 700,430 600,465" marker-end="url(#arrowLog)"/>
  <path class="logflow" d="M806,370 C806,420 720,450 605,468" marker-end="url(#arrowLog)"/>

  <text x="680" y="440" class="edge-label" fill="#6b7280">Diagnostic logs (all services)</text>

  <!-- Legend -->
  <g transform="translate(60,615)">
    <rect width="1080" height="75" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="20" y="24" class="legend" font-weight="700">Legend</text>
    <line x1="90" y1="20" x2="140" y2="20" class="flow" marker-end="url(#arrow)"/>
    <text x="150" y="24" class="legend">Data / event flow</text>
    <line x1="300" y1="20" x2="350" y2="20" class="logflow" marker-end="url(#arrowLog)"/>
    <text x="360" y="24" class="legend">Diagnostic logs to Log Analytics</text>
    <rect x="600" y="12" width="14" height="14" class="rg"/>
    <text x="624" y="24" class="legend">Resource Group: rg-pipeline-prod (PaaS-only, no VNet)</text>
    <text x="20" y="52" class="legend" fill="#6b7280">Source: Storage blob upload &#8594; Event Grid &#8594; Function App (Consumption) &#8594; Cosmos DB (Serverless) + Service Bus. All services stream diagnostics to one Log Analytics workspace.</text>
  </g>
</svg>
