title: "Event-driven blob ingestion pipeline"
subtitle: "Event Grid → Function App → Cosmos DB + Service Bus (PaaS only, no vnet)"

containers:
  - name: "rg-pipeline-prod"
    kind: resource-group
    resources:
      - id: stor
        type: storage-accounts
        label: "ingest-sa"
        meta: ["Blob", "events enabled"]
      - id: eg
        type: event-grid
        label: "blob-events"
        meta: ["System topic"]
      - id: fn
        type: function-app
        label: "process-fn"
        meta: ["Consumption"]
      - id: cos
        type: cosmos-db
        label: "results-cdb"
        meta: ["Serverless"]
      - id: sb
        type: service-bus
        label: "downstream-sb"
        meta: ["Standard"]
      - id: la
        type: log-analytics
        label: "pipeline-law"
        meta: ["Diagnostics sink"]

edges:
  - from: stor
    to: eg
    label: "BlobCreated"
  - from: eg
    to: fn
    label: "trigger"
  - from: fn
    to: cos
    label: "write results"
  - from: fn
    to: sb
    label: "emit message"
  - from: fn
    to: la
    label: "diagnostics"
    style: dotted

metadata:
  Owner: "data-platform"
  Environment: "production"
  Networking: "PaaS only (no vnet)"
  Reviewed: "2026-05-30"
