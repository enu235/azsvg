<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .rg { fill: #f3f7fb; stroke: #0078d4; stroke-width: 2; stroke-dasharray: 6 4; }
      .rg-label { font-size: 13px; font-weight: 700; fill: #0078d4; }
      .vnet { fill: #ffffff; stroke: #2b88d8; stroke-width: 2; }
      .vnet-label { font-size: 12px; font-weight: 600; fill: #243a5e; }
      .svc-box { fill: #ffffff; stroke: #8a8886; stroke-width: 1.2; rx: 6; ry: 6; }
      .svc-name { font-size: 11px; font-weight: 600; fill: #201f1e; text-anchor: middle; }
      .svc-sub { font-size: 10px; fill: #605e5c; text-anchor: middle; }
      .title { font-size: 20px; font-weight: 700; fill: #1b1a19; }
      .subtitle { font-size: 12px; fill: #605e5c; }
      .peer { stroke: #107c10; stroke-width: 2.5; fill: none; }
      .peer-label { font-size: 10px; fill: #107c10; font-weight: 600; }
      .egress { stroke: #d83b01; stroke-width: 2.5; fill: none; stroke-dasharray: 6 3; }
      .egress-label { font-size: 10px; fill: #d83b01; font-weight: 600; }
      .legend-box { fill: #ffffff; stroke: #c8c6c4; stroke-width: 1; }
    </style>

    <marker id="arrow-peer" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#107c10"/>
    </marker>
    <marker id="arrow-egress" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d83b01"/>
    </marker>

    <!-- Azure Firewall icon (stylized brick wall + shield) -->
    <symbol id="ico-firewall" viewBox="0 0 64 64">
      <rect x="6" y="14" width="52" height="36" rx="3" fill="#ff8c00" stroke="#a64b00" stroke-width="1.5"/>
      <rect x="6" y="14" width="52" height="6" fill="#a64b00"/>
      <rect x="10" y="24" width="10" height="8" fill="#fff8e7"/>
      <rect x="22" y="24" width="10" height="8" fill="#fff8e7"/>
      <rect x="34" y="24" width="10" height="8" fill="#fff8e7"/>
      <rect x="46" y="24" width="8" height="8" fill="#fff8e7"/>
      <rect x="10" y="34" width="14" height="8" fill="#fff8e7"/>
      <rect x="26" y="34" width="10" height="8" fill="#fff8e7"/>
      <rect x="38" y="34" width="16" height="8" fill="#fff8e7"/>
      <path d="M32 8 L36 14 L28 14 Z" fill="#d83b01"/>
    </symbol>

    <!-- Bastion icon (tower) -->
    <symbol id="ico-bastion" viewBox="0 0 64 64">
      <rect x="14" y="20" width="36" height="34" fill="#0078d4" stroke="#003966" stroke-width="1.5"/>
      <rect x="14" y="14" width="36" height="8" fill="#003966"/>
      <rect x="10" y="14" width="6" height="10" fill="#003966"/>
      <rect x="48" y="14" width="6" height="10" fill="#003966"/>
      <rect x="20" y="28" width="6" height="8" fill="#cce4f7"/>
      <rect x="30" y="28" width="6" height="8" fill="#cce4f7"/>
      <rect x="40" y="28" width="6" height="8" fill="#cce4f7"/>
      <rect x="28" y="40" width="8" height="14" fill="#cce4f7"/>
    </symbol>

    <!-- AKS icon (kubernetes wheel) -->
    <symbol id="ico-aks" viewBox="0 0 64 64">
      <polygon points="32,6 56,20 56,44 32,58 8,44 8,20" fill="#326ce5" stroke="#1b3d8a" stroke-width="1.5"/>
      <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="4" fill="#ffffff"/>
      <circle cx="32" cy="18" r="2.5" fill="#ffffff"/>
      <circle cx="46" cy="26" r="2.5" fill="#ffffff"/>
      <circle cx="46" cy="38" r="2.5" fill="#ffffff"/>
      <circle cx="32" cy="46" r="2.5" fill="#ffffff"/>
      <circle cx="18" cy="38" r="2.5" fill="#ffffff"/>
      <circle cx="18" cy="26" r="2.5" fill="#ffffff"/>
      <line x1="32" y1="32" x2="32" y2="18" stroke="#ffffff" stroke-width="1"/>
      <line x1="32" y1="32" x2="46" y2="26" stroke="#ffffff" stroke-width="1"/>
      <line x1="32" y1="32" x2="46" y2="38" stroke="#ffffff" stroke-width="1"/>
      <line x1="32" y1="32" x2="32" y2="46" stroke="#ffffff" stroke-width="1"/>
      <line x1="32" y1="32" x2="18" y2="38" stroke="#ffffff" stroke-width="1"/>
      <line x1="32" y1="32" x2="18" y2="26" stroke="#ffffff" stroke-width="1"/>
    </symbol>

    <!-- Cosmos DB icon -->
    <symbol id="ico-cosmos" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="24" fill="#1b3d8a" stroke="#0a1f4d" stroke-width="1.5"/>
      <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#50e6ff" stroke-width="1.5"/>
      <ellipse cx="32" cy="32" rx="9" ry="24" fill="none" stroke="#50e6ff" stroke-width="1.5"/>
      <ellipse cx="32" cy="32" rx="20" ry="20" fill="none" stroke="#50e6ff" stroke-width="0.8" transform="rotate(45 32 32)"/>
      <circle cx="32" cy="32" r="3" fill="#50e6ff"/>
    </symbol>

    <!-- Function App icon (lightning bolt) -->
    <symbol id="ico-function" viewBox="0 0 64 64">
      <rect x="8" y="8" width="48" height="48" rx="4" fill="#feca57" stroke="#7a5a00" stroke-width="1.5"/>
      <path d="M36 14 L20 36 L30 36 L26 50 L44 28 L34 28 Z" fill="#ffffff" stroke="#7a5a00" stroke-width="1"/>
    </symbol>

    <!-- Internet cloud -->
    <symbol id="ico-internet" viewBox="0 0 64 64">
      <path d="M18 38 a10 10 0 1 1 4 -19.5 a12 12 0 0 1 22 4 a8 8 0 0 1 2 15.5 z" fill="#e1e1e1" stroke="#605e5c" stroke-width="1.5"/>
      <text x="32" y="52" font-size="9" text-anchor="middle" fill="#605e5c" font-weight="600">Internet</text>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#fafafa"/>

  <!-- Title -->
  <text x="40" y="40" class="title">Azure Hub-and-Spoke Network Topology</text>
  <text x="40" y="60" class="subtitle">Hub VNet 10.0.0.0/22 with Azure Firewall Premium + Bastion; two peered spokes; egress via firewall</text>

  <!-- Internet -->
  <use href="#ico-internet" x="555" y="80" width="90" height="60"/>

  <!-- Egress arrow Internet -> Firewall -->
  <line x1="600" y1="148" x2="600" y2="200" class="egress" marker-end="url(#arrow-egress)"/>

  <!-- HUB Resource Group -->
  <rect x="380" y="200" width="440" height="240" class="rg" rx="10"/>
  <text x="400" y="222" class="rg-label">rg-net-hub</text>

  <!-- Hub VNet -->
  <rect x="400" y="232" width="400" height="195" class="vnet" rx="8"/>
  <text x="415" y="250" class="vnet-label">Hub VNet  -  10.0.0.0/22</text>

  <!-- Azure Firewall in hub -->
  <rect x="430" y="265" width="160" height="140" class="svc-box"/>
  <use href="#ico-firewall" x="475" y="275" width="70" height="70"/>
  <text x="510" y="365" class="svc-name">Azure Firewall</text>
  <text x="510" y="380" class="svc-sub">Premium SKU</text>
  <text x="510" y="394" class="svc-sub">AzureFirewallSubnet</text>

  <!-- Bastion in hub -->
  <rect x="610" y="265" width="160" height="140" class="svc-box"/>
  <use href="#ico-bastion" x="655" y="275" width="70" height="70"/>
  <text x="690" y="365" class="svc-name">Azure Bastion</text>
  <text x="690" y="380" class="svc-sub">AzureBastionSubnet</text>

  <!-- SPOKE 1: rg-app-prod -->
  <rect x="40" y="500" width="500" height="270" class="rg" rx="10"/>
  <text x="60" y="522" class="rg-label">rg-app-prod  (Spoke 1)</text>

  <rect x="60" y="532" width="460" height="220" class="vnet" rx="8"/>
  <text x="75" y="550" class="vnet-label">Spoke VNet - Application</text>

  <!-- AKS service block -->
  <rect x="90" y="565" width="400" height="170" class="svc-box"/>
  <use href="#ico-aks" x="115" y="585" width="80" height="80"/>
  <text x="155" y="685" class="svc-name">AKS Cluster</text>
  <text x="155" y="700" class="svc-sub">Managed Kubernetes</text>

  <!-- Node pool detail boxes -->
  <rect x="220" y="590" width="120" height="55" fill="#eef5ff" stroke="#326ce5" stroke-width="1" rx="4"/>
  <text x="280" y="610" class="svc-name">System Node Pool</text>
  <text x="280" y="625" class="svc-sub">system workloads</text>
  <text x="280" y="638" class="svc-sub">CriticalAddonsOnly</text>

  <rect x="350" y="590" width="130" height="55" fill="#eef5ff" stroke="#326ce5" stroke-width="1" rx="4"/>
  <text x="415" y="610" class="svc-name">User Node Pool</text>
  <text x="415" y="625" class="svc-sub">application workloads</text>
  <text x="415" y="638" class="svc-sub">autoscale enabled</text>

  <text x="290" y="675" class="svc-sub">Outbound via UDR to Hub Firewall</text>

  <!-- SPOKE 2: rg-data -->
  <rect x="660" y="500" width="500" height="270" class="rg" rx="10"/>
  <text x="680" y="522" class="rg-label">rg-data  (Spoke 2)</text>

  <rect x="680" y="532" width="460" height="220" class="vnet" rx="8"/>
  <text x="695" y="550" class="vnet-label">Spoke VNet - Data</text>

  <!-- Cosmos DB block -->
  <rect x="705" y="565" width="200" height="170" class="svc-box"/>
  <use href="#ico-cosmos" x="755" y="580" width="100" height="100"/>
  <text x="805" y="700" class="svc-name">Cosmos DB</text>
  <text x="805" y="715" class="svc-sub">Provisioned throughput</text>
  <text x="805" y="728" class="svc-sub">Private Endpoint</text>

  <!-- Function App block -->
  <rect x="920" y="565" width="200" height="170" class="svc-box"/>
  <use href="#ico-function" x="975" y="585" width="90" height="90"/>
  <text x="1020" y="700" class="svc-name">Azure Function App</text>
  <text x="1020" y="715" class="svc-sub">Consumption plan</text>
  <text x="1020" y="728" class="svc-sub">VNet integration</text>

  <!-- Peering lines (bidirectional) -->
  <path d="M 460 440 Q 350 470 290 500" class="peer" marker-end="url(#arrow-peer)" marker-start="url(#arrow-peer)"/>
  <text x="290" y="475" class="peer-label" transform="rotate(-22 290 475)">VNet Peering</text>

  <path d="M 740 440 Q 850 470 910 500" class="peer" marker-end="url(#arrow-peer)" marker-start="url(#arrow-peer)"/>
  <text x="855" y="475" class="peer-label" transform="rotate(22 855 475)">VNet Peering</text>

  <!-- Egress flow indicators from spokes through firewall -->
  <path d="M 230 565 Q 200 460 470 405" class="egress" marker-end="url(#arrow-egress)"/>
  <text x="160" y="500" class="egress-label">Egress via UDR</text>

  <path d="M 970 565 Q 1010 460 560 405" class="egress" marker-end="url(#arrow-egress)"/>
  <text x="1010" y="500" class="egress-label">Egress via UDR</text>

  <!-- Legend -->
  <rect x="40" y="90" width="240" height="100" class="legend-box" rx="6"/>
  <text x="52" y="110" class="vnet-label">Legend</text>
  <line x1="55" y1="125" x2="95" y2="125" class="peer"/>
  <text x="105" y="129" font-size="11" fill="#201f1e">VNet Peering (bidirectional)</text>
  <line x1="55" y1="148" x2="95" y2="148" class="egress"/>
  <text x="105" y="152" font-size="11" fill="#201f1e">Egress traffic (via Firewall)</text>
  <rect x="55" y="162" width="40" height="14" class="rg"/>
  <text x="105" y="174" font-size="11" fill="#201f1e">Resource Group boundary</text>
</svg>
