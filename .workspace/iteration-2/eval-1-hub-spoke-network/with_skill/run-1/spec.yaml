title: "Hub-and-spoke network"
subtitle: "Centralized egress via Azure Firewall Premium"

containers:
  - name: "rg-net-hub"
    kind: resource-group
    containers:
      - name: "vnet-hub  10.0.0.0/22"
        kind: vnet
        resources:
          - id: afw
            type: firewalls
            label: "azfw-hub"
            meta: ["Premium", "central egress"]
          - id: bas
            type: bastions
            label: "bastion-hub"

  - name: "rg-app-prod"
    kind: resource-group
    containers:
      - name: "vnet-app-prod"
        kind: vnet
        resources:
          - id: aks
            type: kubernetes-services
            label: "aks-prod"
            meta: ["System + User node pools"]

  - name: "rg-data"
    kind: resource-group
    containers:
      - name: "vnet-data"
        kind: vnet
        resources:
          - id: cosmos
            type: azure-cosmos-db
            label: "cosmos-data"
            meta: ["Provisioned"]
          - id: func
            type: function-apps
            label: "func-data"
            meta: ["Consumption"]

edges:
  # VNet peering — network-layer, dashed
  - from: afw
    to: aks
    label: "peering"
    style: dashed
  - from: afw
    to: func
    label: "peering"
    style: dashed

  # Egress through firewall — application dataflow, solid
  - from: aks
    to: afw
    label: "egress"
  - from: func
    to: afw
    label: "egress"

metadata:
  Owner: "platform-eng"
  Topology: "hub-and-spoke"
  Hub CIDR: "10.0.0.0/22"
  Reviewed: "2026-05-30"
