title: "Hub-and-spoke network"
subtitle: "Centralized egress via Azure Firewall Premium"

containers:
  - name: "rg-net-hub"
    kind: resource-group
    containers:
      - name: "vnet-hub · 10.0.0.0/22"
        kind: vnet
        resources:
          - id: afw
            type: firewalls
            label: "hub-afw"
            meta: ["Premium"]
          - id: bas
            type: bastions
            label: "hub-bas"
  - name: "rg-app-prod"
    kind: resource-group
    containers:
      - name: "vnet-app · 10.1.0.0/16"
        kind: vnet
        resources:
          - id: aks
            type: kubernetes-services
            label: "prod-aks"
            meta: ["System + User pools"]
  - name: "rg-data"
    kind: resource-group
    containers:
      - name: "vnet-data · 10.2.0.0/16"
        kind: vnet
        resources:
          - id: fn
            type: function-apps
            label: "data-fn"
            meta: ["Consumption"]
          - id: cos
            type: azure-cosmos-db
            label: "data-cosmos"
            meta: ["Provisioned"]

edges:
  - from: afw
    to: aks
    label: "peering"
    style: dashed
  - from: afw
    to: fn
    label: "peering"
    style: dashed
  - from: aks
    to: afw
    label: "egress"
  - from: fn
    to: afw
    label: "egress"
  - from: fn
    to: cos
    label: "data plane"

metadata:
  Owner: "platform-eng"
  Topology: "hub-and-spoke"
  Reviewed: "2026-05-30"
