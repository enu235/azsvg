title: "Event-driven blob ingestion pipeline"
subtitle: "Event Grid fan-out to Functions, with Cosmos DB and Service Bus outputs"

containers:
  - name: "rg-pipeline-prod"
    kind: resource-group
    layout: row
    resources:
      - id: storage
        type: storage-accounts
        label: "Blob storage"
        meta: ["source blobs"]
      - id: egrid
        type: event-grid-topics
        label: "Event Grid"
        meta: ["system topic"]
      - id: func
        type: function-apps
        label: "Function App"
        meta: ["Consumption"]
      - id: cosmos
        type: azure-cosmos-db
        label: "Cosmos DB"
        meta: ["Serverless"]
      - id: sbus
        type: azure-service-bus
        label: "Service Bus"
        meta: ["downstream queue"]
      - id: law
        type: log-analytics-workspaces
        label: "Log Analytics"
        meta: ["central workspace"]

edges:
  - from: storage
    to: egrid
    label: "blob created"
  - from: egrid
    to: func
    label: "event trigger"
  - from: func
    to: cosmos
    label: "write results"
  - from: func
    to: sbus
    label: "emit message"
  - from: func
    to: law
    label: "diagnostics"
    style: dotted

metadata:
  Resource group: "rg-pipeline-prod"
  Networking: "PaaS only (no vnet)"
  Function tier: "Consumption"
  Cosmos mode: "Serverless"
