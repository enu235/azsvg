title: "Contoso Payment Service on Azure"
subtitle: "App Service + Azure SQL with private endpoints (West US 2, multi-region planned)"

containers:
  - name: "rg-payment-prod"
    kind: resource-group
    meta: ["West US 2"]
    resources:
      - id: kv
        type: key-vault
        label: "kv-payment-prod"
        meta: ["connection strings"]
      - id: ai
        type: application-insights
        label: "ai-payment-prod"
        meta: ["telemetry"]
    containers:
      - name: "vnet-payment - 10.20.0.0/16"
        kind: vnet
        containers:
          - name: "snet-app - app service integration"
            kind: subnet
            resources:
              - id: app
                type: app-service
                label: "app-payment-prod"
                meta: ["P2v3", "West US 2"]
          - name: "snet-data - private endpoints"
            kind: subnet
            resources:
              - id: pe-sql
                type: private-endpoints
                label: "pe-sql"
              - id: pe-kv
                type: private-endpoints
                label: "pe-kv"
              - id: sql
                type: sql-database
                label: "sqldb-payment-prod"
                meta: ["General Purpose"]

edges:
  - from: app
    to: pe-sql
    label: "SQL / private endpoint"
  - from: pe-sql
    to: sql
    style: dashed
  - from: app
    to: pe-kv
    label: "secrets / private endpoint"
  - from: pe-kv
    to: kv
    style: dashed
  - from: app
    to: ai
    label: "telemetry"
    style: dotted

metadata:
  Owner: "payments platform"
  Environment: "production"
  Region: "West US 2 (multi-region planned)"
  Reviewed: "2026-05-30"
